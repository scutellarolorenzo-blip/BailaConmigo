    <style>
        body { font-family: 'Inter', sans-serif; transition: background 0.5s ease, color 0.5s ease; }

            max-height: 85vh;

        /* --- STILI DINAMICI PER CIASCUN TEMA --- */
        
        /* 1. TEMA SCURO */
       /* --- 6 TEMI RINNOVATI, SOBRI ED ELEGANTI --- */
        
        /* 1. NOTTE ELEGANTE (Scuro Profondo) */
        body.theme-dark {
            background: linear-gradient(135deg, #0f0c1b 0%, #1a153b 50%, #120924 100%);
            color: #f3f4f6;
            --accent: #f472b6;
            --accent-gradient: linear-gradient(to right, #ec4899, #f43f5e);
            --card-bg: rgba(30, 24, 54, 0.75);
            --card-border: rgba(244, 114, 182, 0.2);
            --input-bg: rgba(18, 14, 33, 0.9);
            --input-border: rgba(244, 114, 182, 0.3);
            --modal-bg: linear-gradient(145deg, #22193b, #120d21);
        }

        /* 2. CARTA PERGAMENA (Chiaro Sobrio) */
        body.theme-light {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 50%, #e2e8f0 100%);
            color: #1e293b;
            --accent: #be123c;
            --accent-gradient: linear-gradient(to right, #e11d48, #be123c);
            --card-bg: rgba(255, 255, 255, 0.95);
            --card-border: #cbd5e1;
            --input-bg: #ffffff;
            --input-border: #94a3b8;
            --modal-bg: #ffffff;
        }

        /* 3. BLU OCEANO (Fresco & Pulito) */
        body.theme-cool {
            background: linear-gradient(135deg, #020617 0%, #091e3a 50%, #0369a1 100%);
            color: #f0f9ff;
            --accent: #38bdf8;
            --accent-gradient: linear-gradient(to right, #0284c7, #38bdf8);
            --card-bg: rgba(15, 23, 42, 0.8);
            --card-border: rgba(56, 189, 248, 0.25);
            --input-bg: rgba(15, 23, 42, 0.95);
            --input-border: rgba(56, 189, 248, 0.35);
            --modal-bg: linear-gradient(145deg, #1e293b, #0f172a);
        }

        /* 4. VERDE SALVIA (Naturale & Rilassante) */
        body.theme-sage {
            background: linear-gradient(135deg, #06231b 0%, #0d382d 50%, #022c22 100%);
            color: #ecfdf5;
            --accent: #34d399;
            --accent-gradient: linear-gradient(to right, #059669, #34d399);
            --card-bg: rgba(6, 43, 33, 0.75);
            --card-border: rgba(52, 211, 153, 0.25);
            --input-bg: rgba(4, 30, 23, 0.9);
            --input-border: rgba(52, 211, 153, 0.35);
            --modal-bg: linear-gradient(145deg, #06392c, #032018);
        }

        /* 5. ACCIAIO MODERNO (Minimal & Neutro) */
        body.theme-steel {
            background: linear-gradient(135deg, #18181b 0%, #27272a 50%, #09090b 100%);
            color: #fafafa;
            --accent: #a1a1aa;
            --accent-gradient: linear-gradient(to right, #71717a, #d4d4d8);
            --card-bg: rgba(39, 39, 42, 0.75);
            --card-border: rgba(161, 161, 170, 0.25);
            --input-bg: rgba(24, 24, 27, 0.9);
            --input-border: rgba(161, 161, 170, 0.35);
            --modal-bg: linear-gradient(145deg, #27272a, #121214);
        }

        /* 6. TRAMONTO CALDO (Accogliente) */
        body.theme-warm {
            background: linear-gradient(135deg, #1c0f0a 0%, #3d1a0f 50%, #5c2412 100%);
            color: #fff7ed;
            --accent: #fb923c;
            --accent-gradient: linear-gradient(to right, #ea580c, #fb923c);
            --card-bg: rgba(53, 23, 14, 0.8);
            --card-border: rgba(251, 146, 60, 0.25);
            --input-bg: rgba(36, 14, 8, 0.95);
            --input-border: rgba(251, 146, 60, 0.35);
            --modal-bg: linear-gradient(145deg, #421c10, #240e06);
        }

        .app-header, .app-nav { background: var(--card-bg); border-color: var(--card-border); backdrop-filter: blur(16px); }
        .glass-card { background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(16px); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15); transition: all 0.3s ease; }
        .glass-card:hover { transform: translateY(-3px); border-color: var(--accent); }
        .modal-box { background: var(--modal-bg); border: 1px solid var(--card-border); box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4); color: inherit; }
        .custom-input { background: var(--input-bg); border: 1px solid var(--input-border); color: inherit; }
        .accent-bg { background: var(--accent-gradient); }
        .accent-text { color: var(--accent); }

        /* File input personalizzato */
        input[type="file"].custom-file-input::-webkit-file-upload-button {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            margin-right: 12px;
            transition: opacity 0.2s;
        }
        input[type="file"].custom-file-input::-webkit-file-upload-button:hover { opacity: 0.9; }
        input[type="file"].custom-file-input { color: inherit; }

        .custom-select-wrapper { position: relative; width: 100%; }
        .custom-select-trigger {
            width: 100%; display: flex; align-items: center; justify-content: space-between;
            box-sizing: border-box; padding: 12px 16px; border-radius: 14px; cursor: pointer; transition: all 0.2s ease; font-size: 0.875rem;
            background: var(--input-bg); border: 1px solid var(--input-border); color: inherit;
        }
        .custom-select-trigger span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; text-align: left; }
        .custom-select-options {
            display: none; 
            position: absolute; 
            left: 0; 
            width: 100% !important;
            max-height: 200px; 
            overflow-y: auto; 
            border-radius: 14px !important; 
            padding: 6px !important;
            z-index: 999999 !important; 
            box-sizing: border-box; 
            background: var(--modal-bg) !important; 
            border: 1px solid var(--card-border) !important; 
            color: inherit !important;
        }
        
        /* AGGIUNGI QUESTE RIGHE SUBITO SOTTO */
        #signup-courses-container, #edit-student-courses-container, #signup-courses-section {
            overflow: visible !important;
        }
        .custom-option {
            padding: 10px 14px; font-size: 13px; font-weight: 500; border-radius: 10px; cursor: pointer;
            transition: all 0.18s ease; display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; box-sizing: border-box; color: inherit;
        }
        .custom-option:hover { background: var(--card-border); }
        .modal-overlay { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(12px); }
    </style>

                    { id: 'secondo-intermedio', name: 'Segundo Intermedio', subtitle: 'Ondulazioni e passaggi' },
                    { id: 'intermedio-avanzato', name: 'Intermedio Avanzato', subtitle: 'Footwork e figure avanzate' }
                ]
            },
            { 
                id: 'kizomba', name: 'Kizomba', desc: 'Base & Intermedio', icon: 'fa-music', 
                bgImage: 'https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?auto=format&fit=crop&w=600&q=80',
                levels: [
                    { id: 'base', name: 'Base', subtitle: 'Passo base e connessione di coppia' },
                    { id: 'intermedio', name: 'Intermedio', subtitle: 'Saída, variações e blocks' }
                ]
            },
            { 
                id: 'rueda', name: 'Rueda de Casino', desc: 'Livello Avanzato', icon: 'fa-circle-nodes', 
                bgImage: 'https://images.unsplash.com/photo-1504609773096-104ff2c73ba4?auto=format&fit=crop&w=600&q=80',
                levels: [
                    { id: 'avanzato', name: 'Avanzato', subtitle: 'Chiamate complesse e cambi di dama' }
                ]
            }
        ];

        const defaultVideos = [];

        let state = {
            currentRoute: 'home',
            selectedCategory: null,
            selectedLevel: null,
            user: null,
            userProfile: null,
            isAdmin: false,
            authMode: 'login',
            favorites: JSON.parse(localStorage.getItem('baila_favorites')) || [],
            videos: [],
            categories: [],
            studentsList: [],
            currentVideoModal: null
        };

        window.addEventListener('DOMContentLoaded', async () => {
            const savedTheme = localStorage.getItem('baila_theme') || 'dark';
            setTheme(savedTheme, false);

            await checkSessionAndProfile();
            await loadDataFromCloud();
            
            // Ripristina la pagina precedente salvata se si aggiorna la pagina (refresh)
            const savedRoute = localStorage.getItem('baila_current_route');
            const savedCat = localStorage.getItem('baila_selected_cat');
            const savedLvl = localStorage.getItem('baila_selected_lvl');

            if (savedRoute && state.user) {
                state.currentRoute = savedRoute;
                if (savedCat) state.selectedCategory = savedCat;
                if (savedLvl) state.selectedLevel = savedLvl;
            } else if (state.isAdmin) {
                state.currentRoute = 'admin';
            }

            // Inizializza lo stato della cronologia del browser
            history.replaceState({ route: state.currentRoute, cat: state.selectedCategory, lvl: state.selectedLevel }, '');

            render();
            updateBottomNav(); 

            // Gestione del tasto "Indietro" del browser / dispositivo mobile
            window.addEventListener('popstate', (event) => {
                if (event.state && event.state.route) {
                    state.currentRoute = event.state.route;
                    state.selectedCategory = event.state.cat || null;
                    state.selectedLevel = event.state.lvl || null;
                    localStorage.setItem('baila_current_route', state.currentRoute);
                    localStorage.setItem('baila_selected_cat', state.selectedCategory || '');
                    localStorage.setItem('baila_selected_lvl', state.selectedLevel || '');
                    render();
                    updateBottomNav();
                }
            }); // Sincronizza subito l'icona attiva nella navbar in basso

            supabaseClient
                .channel('public:profiles')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, async (payload) => {
                    await checkSessionAndProfile();
                    await loadDataFromCloud();
                    render();
                })
                .subscribe();
                // Registrazione Service Worker per PWA
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('./sw.js')
                        .then((reg) => console.log('Service Worker registrato:', reg.scope))
                        .catch((err) => console.log('Errore Service Worker:', err));
                }
        });

        async function checkSessionAndProfile() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session && session.user) {
                state.user = session.user;
                if (session.user.email === ADMIN_EMAIL) {
                    state.isAdmin = true;
                    state.userProfile = { username: 'Admin', status: 'approved' };
                    state.currentRoute = 'admin';
                    state.favorites = [];
                } else {
                    let { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
                    state.userProfile = profile;
                    state.isAdmin = false;
                    // Carica i preferiti personali dal profilo Cloud di questo specifico account
                    state.favorites = profile?.favorites || [];
                }
            } else {
                state.user = null;
                state.userProfile = null;
                state.isAdmin = false;
                state.favorites = [];
            }
            updateAuthUI();
            updateBottomNav();
        }

        function setAuthMode(mode) {
            state.authMode = mode;
            const loginTab = document.getElementById('tab-login');
            const signupTab = document.getElementById('tab-signup');
            const title = document.getElementById('auth-modal-title');
            const desc = document.getElementById('auth-modal-desc');
            const btn = document.getElementById('auth-submit-btn');
            const label = document.getElementById('label-username');
            const coursesSection = document.getElementById('signup-courses-section');

            document.getElementById('auth-username').value = '';
            document.getElementById('auth-password').value = '';

            if (mode === 'login') {
                loginTab.className = "flex-1 py-2 text-xs font-bold rounded-xl accent-bg text-white transition";
                signupTab.className = "flex-1 py-2 text-xs font-bold rounded-xl opacity-70 transition";
                title.innerText = "Accedi";
                desc.innerText = "Inserisci le tue credenziali per entrare";
                label.innerText = "Nome e Cognome (o Email Admin)";
                btn.innerText = "Accedi";
                coursesSection.classList.add('hidden');
            } else {
                signupTab.className = "flex-1 py-2 text-xs font-bold rounded-xl accent-bg text-white transition";
                loginTab.className = "flex-1 py-2 text-xs font-bold rounded-xl opacity-70 transition";
                title.innerText = "Registrati";
                desc.innerText = "Crea il tuo account, seleziona i corsi e invia la richiesta.";
                label.innerText = "Nome e Cognome";
                btn.innerText = "Invia richiesta di accesso";
                coursesSection.classList.remove('hidden');
                renderSignupCoursesCheckboxes();
            }
        }

       function renderSignupCoursesCheckboxes() {
            const container = document.getElementById('signup-courses-container');
            if (!container) return;
            let html = '';
            state.categories.forEach(cat => {
                let firstLvl = cat.levels && cat.levels.length > 0 ? cat.levels[0] : { id: 'base', name: 'Base' };
                html += `
                    <div class="p-3 rounded-2xl glass-card space-y-2 shadow-inner relative" style="overflow: visible !important; z-index: 1;">
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" name="signup-course" value="${cat.id}" onchange="toggleCourseLevelsSelection('${cat.id}', this.checked)" class="rounded accent-pink-500">
                            <span class="font-bold text-xs">${cat.name}</span>
                        </label>
                        <div id="levels-container-${cat.id}" class="hidden pl-5 space-y-1">
                            <span class="text-[10px] opacity-70 uppercase block font-semibold">Livello massimo frequentato:</span>
                            
                            <div class="custom-select-wrapper" id="select-wrapper-signup-${cat.id}">
                                <input type="hidden" id="signup-level-${cat.id}" value="${firstLvl.id}">

                                    <i class="fa-solid fa-chevron-down text-xs opacity-70 ml-2"></i>
                                </div>
                                <div class="custom-select-options modal-box" id="options-signup-${cat.id}">
                                    ${cat.levels.map(l => `
                                        <div class="custom-option ${l.id === firstLvl.id ? 'selected' : ''}" onclick="selectSignupOption('${cat.id}', '${l.id}', '${l.name.replace(/'/g, "\\'")}')">
                                            <span>${l.name}</span>${l.id === firstLvl.id ? '<i class="fa-solid fa-check text-xs"></i>' : ''}

        function selectSignupOption(catId, value, name) {
            document.getElementById(`signup-level-${catId}`).value = value;
            document.getElementById(`trigger-label-signup-${catId}`).innerText = name;
            document.getElementById(`options-signup-${catId}`).style.display = 'none';

            const container = document.getElementById(`options-signup-${catId}`);
            container.querySelectorAll('.custom-option').forEach(opt => {
                opt.classList.remove('selected');
                const check = opt.querySelector('i.fa-check');
                if(check) check.remove();
            });

            event.currentTarget.classList.add('selected');
            event.currentTarget.innerHTML += '<i class="fa-solid fa-check text-xs"></i>';
        }

        function toggleCourseLevelsSelection(catId, isChecked) {
            const container = document.getElementById(`levels-container-${catId}`);
            if (isChecked) {
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
            }
        }

        function handleAuthClick() {
            if (state.user) {
                showConfirmModal(
                    "Conferma Logout",
                    "Vuoi effettuare il logout dal tuo account?",
                    () => {
                        supabaseClient.auth.signOut();
                        state.user = null;
                        state.userProfile = null;
                        state.isAdmin = false;
                        state.currentRoute = 'home';
                        
                        document.getElementById('auth-username').value = '';
                        document.getElementById('auth-password').value = '';
                        setAuthMode('login');

                        updateAuthUI();
                        showToast('Logout effettuato', 'info');
                        render();
                        updateBottomNav();
                    }
                );
            } else {
                document.getElementById('auth-modal').classList.remove('hidden');
            }
        }

        async function processAuth(e) {
            e.preventDefault();
            const inputVal = document.getElementById('auth-username').value.trim();
            const password = document.getElementById('auth-password').value;

            try {
                if (state.authMode === 'signup') {
                    let usernameClean = inputVal.toLowerCase();
                    
                    let { data: existing } = await supabaseClient.from('profiles').select('*').eq('username', usernameClean).maybeSingle();
                    if (existing) {
                        showToast('Questo nome e cognome risulta già registrato.', 'error');
                        return;
                    }

                    let subscriptions = {};
                    document.querySelectorAll('input[name="signup-course"]:checked').forEach(chk => {
                        let catId = chk.value;
                        let lvlSelect = document.getElementById(`signup-level-${catId}`);
                        subscriptions[catId] = lvlSelect ? lvlSelect.value : 'base';
                    });

                    if (Object.keys(subscriptions).length === 0) {
                        showToast('Seleziona almeno un corso a cui partecipi.', 'error');
                        return;
                    }

                    let emailToUse = `${usernameClean.replace(/[^a-z0-9\s]/g, '').trim().replace(/\s+/g, '_')}@bailaconmigo.student`;

                    let { data: authData, error: authErr } = await supabaseClient.auth.signUp({ email: emailToUse, password });
                    if (authErr) {
                        showToast('Errore registrazione: ' + authErr.message, 'error');
                        return;
                    }

                    if (authData.user) {
                        let { error: profileErr } = await supabaseClient.from('profiles').insert([{ 
                            id: authData.user.id, 
                            username: usernameClean, 
                            status: 'pending',
                            subscriptions: subscriptions 
                        }]);

                        if (profileErr) {
                            showToast('Errore salvataggio profilo: ' + profileErr.message, 'error');
                            console.error(profileErr);
                            return;
                        }

                        showToast('Richiesta inviata con successo! In attesa di approvazione.', 'success');
                        
                        document.getElementById('auth-username').value = '';
                        document.getElementById('auth-password').value = '';
                        setAuthMode('login');
                        await checkSessionAndProfile();
                        render();
                    }
                } else {
                    let emailToLogin = inputVal.includes('@') ? inputVal : `${inputVal.toLowerCase().replace(/[^a-z0-9\s]/g, '').trim().replace(/\s+/g, '_')}@bailaconmigo.student`;
                    
                    let { error } = await supabaseClient.auth.signInWithPassword({ email: emailToLogin, password });
                    if (error) {
                        showToast('Credenziali non valide o non ancora approvato.', 'error');
                        return;
                    }
                    showToast('Accesso riuscito!', 'success');
                    
                    document.getElementById('auth-username').value = '';
                    document.getElementById('auth-password').value = '';

                    await checkSessionAndProfile();
                    render();
                }
            } catch (err) {
                console.error(err);
                showToast('Errore di connessione', 'error');
            }
        }

        function updateAuthUI() {
            const btnText = document.getElementById('auth-btn-text');
            const bottomNav = document.getElementById('bottom-nav');
            const authModal = document.getElementById('auth-modal');
            const navAdmin = document.getElementById('nav-admin');

            if (state.user) {
                authModal.classList.add('hidden');
                if (state.isAdmin) {
                    btnText.innerText = 'Admin - Logout';
                    if (navAdmin) navAdmin.style.display = 'flex';
                    bottomNav.classList.remove('hidden');
                } else if (state.userProfile && state.userProfile.status === 'approved') {
                    // Mostra il nome dell'utente in alto a sinistra seguito da Logout
                    let nomeUtente = state.userProfile.username.charAt(0).toUpperCase() + state.userProfile.username.slice(1);
                    btnText.innerText = `${nomeUtente} (Logout)`;
                    if (navAdmin) navAdmin.style.display = 'none';
                    bottomNav.classList.remove('hidden');
                } else {
                    btnText.innerText = 'In attesa - Logout';
                    bottomNav.classList.add('hidden');
                }
            } else {
                btnText.innerText = 'Accedi / Registrati';
                bottomNav.classList.add('hidden');
                authModal.classList.add('hidden');
            }
        }

        function toggleThemeMenu() {
            const dropdown = document.getElementById('theme-dropdown');
            dropdown.classList.toggle('hidden');
        }

        function setTheme(themeName, save = true) {
            const body = document.getElementById('main-body');
            body.className = `theme-${themeName} h-full flex flex-col antialiased selection:bg-pink-500 selection:text-white`;
            if (save) {
                localStorage.setItem('baila_theme', themeName);
                toggleThemeMenu();
            }
        }

        async function loadDataFromCloud() {
            try {
                let { data: catData, error: catError } = await supabaseClient.from('categories').select('*');
                if (catError || !catData || catData.length === 0) {
                    state.categories = defaultCategories;
                } else {
                    state.categories = catData.filter(c => c.id !== 'admin_config').map(c => typeof c.data === 'string' ? JSON.parse(c.data) : c);
                    if (state.categories.length === 0) state.categories = defaultCategories;
                }

                let { data: vidData, error: vidError } = await supabaseClient.from('videos').select('*');
                if (vidError || !vidData || vidData.length === 0) {
                    state.videos = defaultVideos;
                } else {
                    state.videos = vidData.map(v => ({
                        id: v.id.toString(),
                        title: v.title,
                        category: v.category,
                        level: v.level,
                        url: v.url,
                        duration: v.duration || '5:00',
                        desc: v.description || v.desc
                    }));
                }

                let { data: profData } = await supabaseClient.from('profiles').select('*');
                if (profData) {
                    state.studentsList = profData;
                }
            } catch (err) {
                console.error("Errore connessione Cloud, uso dati locali", err);
                state.categories = defaultCategories;
                state.videos = defaultVideos;
            }
        }

        async function saveCategoriesToCloud() {
            try {
                for (let cat of state.categories) {
                    await supabaseClient.from('categories').upsert({ id: cat.id, name: cat.name, desc: cat.desc, icon: cat.icon, bgImage: cat.bgImage, levels: cat.levels });
                }
            } catch (e) { console.error("Errore salvataggio categorie", e); }
        }

        function navigate(route, param1 = null, param2 = null, pushHistory = true) {
            if (route === 'admin' && !state.isAdmin) {
                openAuthModal();
                return;
            }
            state.currentRoute = route;
            if (route === 'levels') state.selectedCategory = param1;
            if (route === 'videos') {
                state.selectedCategory = param1;
                state.selectedLevel = param2;
            }
            if (route === 'home' || route === 'favorites' || route === 'admin') {
                state.selectedCategory = null;
                state.selectedLevel = null;
            }

            // Salva lo stato corrente per il refresh
            localStorage.setItem('baila_current_route', state.currentRoute);
            localStorage.setItem('baila_selected_cat', state.selectedCategory || '');
            localStorage.setItem('baila_selected_lvl', state.selectedLevel || '');

            if (pushHistory) {
                history.pushState({ route: state.currentRoute, cat: state.selectedCategory, lvl: state.selectedLevel }, '');
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
            render();
            updateBottomNav();
        }
        function openAuthModal() {
            document.getElementById('auth-modal').classList.remove('hidden');
        }

        function updateBottomNav() {
            const navHome = document.getElementById('nav-home');
            const navFav = document.getElementById('nav-favorites');
            const navAdmin = document.getElementById('nav-admin');

            if (!navHome || !navFav || !navAdmin) return;

            // Reset di tutti i tab
            navHome.className = 'flex flex-col items-center py-1 px-3 opacity-60 hover:opacity-100 transition';
            navFav.className = 'flex flex-col items-center py-1 px-3 opacity-60 hover:opacity-100 transition';
            navAdmin.className = 'flex flex-col items-center py-1 px-3 opacity-60 hover:opacity-100 transition';

            // Attiva quello giusto in base alla rotta e allo stato admin
            if (state.isAdmin) {
                navAdmin.style.display = 'flex';
                if (state.currentRoute === 'admin') {
                    navAdmin.className = 'flex flex-col items-center py-1 px-3 accent-text transition scale-105';
                } else if (state.currentRoute === 'home' || state.currentRoute === 'levels' || state.currentRoute === 'videos') {
                    navHome.className = 'flex flex-col items-center py-1 px-3 accent-text transition scale-105';
                } else if (state.currentRoute === 'favorites') {
                    navFav.className = 'flex flex-col items-center py-1 px-3 accent-text transition scale-105';
                }
            } else {
                navAdmin.style.display = 'none';
                if (state.currentRoute === 'home' || state.currentRoute === 'levels' || state.currentRoute === 'videos') {
                    navHome.className = 'flex flex-col items-center py-1 px-3 accent-text transition scale-105';
                } else if (state.currentRoute === 'favorites') {
                    navFav.className = 'flex flex-col items-center py-1 px-3 accent-text transition scale-105';
                }
            }
        }

        function render() {
            const container = document.getElementById('app-container');
            container.innerHTML = '';

            if (!state.user) {
                container.innerHTML = `
                    <div class="text-center py-24 glass-card rounded-3xl p-8 max-w-lg mx-auto mt-12">
                        <i class="fa-solid fa-lock text-5xl accent-text mb-4 animate-pulse"></i>
                        <h2 class="text-2xl font-extrabold mb-2">Accesso Riservato</h2>
                        <p class="opacity-80 text-sm mb-6">Effettua l'accesso o registrati per visualizzare i corsi dell'Accademia di Ballo.</p>
                        <button onclick="openAuthModal()" class="px-6 py-3 accent-bg text-white font-bold rounded-2xl text-xs shadow-lg">Accedi / Registrati</button>
                    </div>
                `;
                document.getElementById('auth-modal').classList.remove('hidden');
                return;
            }

            if (state.user && !state.isAdmin && (!state.userProfile || state.userProfile.status !== 'approved')) {
                container.innerHTML = `
                    <div class="text-center py-24 glass-card rounded-3xl p-8 max-w-lg mx-auto mt-12">
                        <i class="fa-solid fa-clock-rotate-left text-5xl accent-text mb-4 animate-bounce"></i>
                        <h2 class="text-2xl font-extrabold mb-2">In Attesa di Approvazione</h2>
                        <p class="opacity-80 text-sm mb-6">Il tuo account è in attesa che l'amministratore accetti la tua richiesta. Una volta approvato, potrai accedere a tutti i corsi.</p>
                        <button onclick="handleAuthClick()" class="px-6 py-3 glass-card rounded-2xl text-xs font-semibold shadow">Effettua il Logout</button>
                    </div>
                `;
                return;
            }

            switch(state.currentRoute) {
                case 'home':
                    container.innerHTML = renderHome();
                    break;
                case 'levels':
                    container.innerHTML = renderLevels();
                    break;
                case 'videos':
                    container.innerHTML = renderVideoList();
                    break;
                case 'favorites':
                    container.innerHTML = renderFavorites();
                    break;
                case 'admin':
                    if (!state.isAdmin) { navigate('home'); return; }
                    container.innerHTML = renderAdminPanel();
                    break;
            }
        }
        function canAccessCourse(catId) {
            if (state.isAdmin) return true;
            if (!state.userProfile || !state.userProfile.subscriptions) return false;
            return !!state.userProfile.subscriptions[catId];
        }

        function canAccessLevel(catId, levelId) {
            if (state.isAdmin) return true;
            if (!state.userProfile || !state.userProfile.subscriptions) return false;
            
            // L'utente può accedere solo se il livello salvato nel suo abbonamento corrisponde esattamente a questo livello
            let assignedLevelId = state.userProfile.subscriptions[catId];
            return assignedLevelId === levelId;
        }

                        <h2 class="text-2xl sm:text-3xl font-extrabold mb-2">Benvenuto, ${state.isAdmin ? 'Amministratore' : (state.userProfile ? state.userProfile.username.charAt(0).toUpperCase() + state.userProfile.username.slice(1) : 'Studente')}!</h2>
                        <p class="opacity-75 text-sm max-w-xl leading-relaxed">Seleziona la disciplina che preferisci e ripassa tutte le figure studiate a lezione ovunque tu sia.</p>

            if (availableCategories.length === 0) {
                html += `<div class="col-span-full text-center py-12 glass-card rounded-3xl"><p class="text-sm opacity-60">Nessun corso abilitato al momento. Attendi che l'amministratore approvi le tue iscrizioni.</p></div>`;

        function toggleCustomSelect(type) {
            const optionsEl = document.getElementById(`options-${type}`);
            const wrapper = optionsEl.closest('.custom-select-wrapper');
            
            // Chiudi tutti gli altri menu e resetta
            document.querySelectorAll('.custom-select-options').forEach(el => {
                if(el !== optionsEl) {
                    el.style.display = 'none';
                    el.style.top = '';
                    el.style.bottom = '';
                    const parentCard = el.closest('.glass-card');
                    if(parentCard) parentCard.style.zIndex = '1';
                }
            });

            const parentCard = optionsEl.closest('.glass-card');

            if (optionsEl.style.display === 'block') {
                optionsEl.style.display = 'none';
                optionsEl.style.top = '';
                optionsEl.style.bottom = '';
                if(parentCard) parentCard.style.zIndex = '1';
            } else {
                // Calcola lo spazio disponibile rispetto al fondo della finestra o del modale
                optionsEl.style.display = 'block';
                const rect = optionsEl.getBoundingClientRect();
                const windowHeight = window.innerHeight;

                // Se esce dallo schermo in basso (lasciando un margine di 20px), aprilo verso l'alto
                if (rect.bottom > windowHeight - 20) {
                    optionsEl.style.bottom = 'calc(100% + 8px)';
                    optionsEl.style.top = 'auto';
                } else {
                    optionsEl.style.top = 'calc(100% + 8px)';
                    optionsEl.style.bottom = 'auto';
                }

                if(parentCard) parentCard.style.zIndex = '100';
            }
        }

        function selectCustomOption(type, value, name) {
            document.getElementById(`form-${type}`).value = value;
            document.getElementById(`trigger-label-${type}`).innerText = name;
            document.getElementById(`options-${type}`).style.display = 'none';

            const container = document.getElementById(`options-${type}`);
            container.querySelectorAll('.custom-option').forEach(opt => {
                opt.classList.remove('selected');
                const check = opt.querySelector('i.fa-check');
                if(check) check.remove();
            });

            event.currentTarget.classList.add('selected');
            event.currentTarget.innerHTML += '<i class="fa-solid fa-check text-xs"></i>';

            if (type === 'category') {
                updateAdminLevelsSelectCustom(value);
            }
        }

        function updateAdminLevelsSelectCustom(catId) {
            const cat = state.categories.find(c => c.id === catId);
            const levelOptionsContainer = document.getElementById('options-level');
            const levelInput = document.getElementById('form-level');
            const levelTriggerLabel = document.getElementById('trigger-label-level');

            if (!cat || !cat.levels || cat.levels.length === 0) {
                levelInput.value = '';
                levelTriggerLabel.innerText = 'Nessun livello';
                levelOptionsContainer.innerHTML = '<div class="custom-option"><span>Nessun livello</span></div>';
                return;
            }

            const firstLvl = cat.levels[0];
            levelInput.value = firstLvl.id;
            levelTriggerLabel.innerText = firstLvl.name;

            levelOptionsContainer.innerHTML = cat.levels.map(l => `
                <div class="custom-option ${l.id === firstLvl.id ? 'selected' : ''}" onclick="selectCustomOption('level', '${l.id}', '${l.name.replace(/'/g, "\\'")}')">
                    <span>${l.name}</span>
                    ${l.id === firstLvl.id ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                </div>
            `).join('');
        }

        window.addEventListener('click', (e) => {
            if (!e.target.closest('.custom-select-wrapper') && !e.target.closest('button[onclick="toggleThemeMenu()"]')) {
                document.querySelectorAll('.custom-select-options').forEach(el => {
                    el.style.display = 'none';
                });
                document.getElementById('theme-dropdown').classList.add('hidden');
            }
        });

        let promptCallback = null;

        function showCustomPrompt(title, desc, defaultValue = '', callback) {
            const modal = document.getElementById('custom-prompt-modal');
            const titleEl = document.getElementById('custom-prompt-title');
            const descEl = document.getElementById('custom-prompt-desc');
            const inputEl = document.getElementById('custom-prompt-input');

            titleEl.innerText = title;
            descEl.innerText = desc;
            inputEl.value = defaultValue;
            promptCallback = callback;

            modal.classList.remove('hidden');
            inputEl.focus();
        }
        let confirmCallback = null;

        function showConfirmModal(title, desc, callback) {
            const modal = document.getElementById('custom-prompt-modal');
            const titleEl = document.getElementById('custom-prompt-title');
            const descEl = document.getElementById('custom-prompt-desc');
            const inputEl = document.getElementById('custom-prompt-input');

            titleEl.innerText = title;
            descEl.innerText = desc;
            
            // Nascondiamo l'input di testo poiché serve solo una conferma (OK / Annulla)
            inputEl.style.display = 'none';
            confirmCallback = callback;

            modal.classList.remove('hidden');
        }

        function closeCustomPrompt(confirmed) {
            const modal = document.getElementById('custom-prompt-modal');
            const inputEl = document.getElementById('custom-prompt-input');
            modal.classList.add('hidden');
            
            // Ripristina l'input nel caso fosse stato nascosto dalla modale di conferma
            inputEl.style.display = 'block';

            if (confirmed) {
                if (promptCallback) {
                    promptCallback(inputEl.value.trim());
                } else if (confirmCallback) {
                    confirmCallback();
                }
            }
            promptCallback = null;
            confirmCallback = null;
        }

        async function openCourseModal(courseId = null) {
            let course = courseId ? state.categories.find(c => c.id === courseId) : null;
            
            showCustomPrompt("Gestione Corso", "Inserisci il nome del corso:", course ? course.name : "", async (name) => {
                if (!name) return;
                showCustomPrompt("Gestione Corso", "Inserisci una breve descrizione:", course ? course.desc : "", async (desc) => {
                    if (course) {
                        course.name = name;
                        course.desc = desc;
                    } else {
                        const newId = name.toLowerCase().replace(/[^a-z0-9]/g, '_');
                        state.categories.push({
                            id: newId,
                            name: name,
                            desc: desc || 'Nuovo corso',
                            icon: 'fa-music',
                            levels: [
                                { id: 'base', name: 'Base', subtitle: 'Livello base' }
                            ]
                        });
                    }
                    await saveCategoriesToCloud();
                    showToast('Corsi aggiornati nel Cloud!', 'success');
                    render();
                });
            });
        }

        async function deleteCourse(courseId) {
            if (confirm("Vuoi davvero eliminare questo corso e tutti i suoi video dal Cloud?")) {
                state.categories = state.categories.filter(c => c.id !== courseId);
                state.videos = state.videos.filter(v => v.category !== courseId);
                await saveCategoriesToCloud();
                await supabaseClient.from('videos').delete().eq('category', courseId);
                showToast('Corso eliminato dal Cloud', 'info');
                render();
            }
        }

        async function openLevelModal(courseId) {
            const course = state.categories.find(c => c.id === courseId);
            if (!course) return;

            showCustomPrompt("Aggiungi Livello", "Inserisci il nome del livello (es. Primo Intermedio):", "", async (lvlName) => {
                if (!lvlName) return;
                showCustomPrompt("Aggiungi Livello", "Inserisci una breve descrizione del livello:", "Figure e combinazioni", async (lvlSub) => {
                    const lvlId = lvlName.toLowerCase().replace(/[^a-z0-9]/g, '_');
                    if (!course.levels) course.levels = [];
                    
                    if (course.levels.some(l => l.id === lvlId)) {
                        showToast("Un livello con questo nome esiste già!", "error");
                        return;
                    }

                    course.levels.push({
                        id: lvlId,
                        name: lvlName,
                        subtitle: lvlSub
                    });

                    await saveCategoriesToCloud();
                    showToast('Livello aggiunto nel Cloud', 'success');
                    render();
                });
            });
        }

        async function deleteLevel(courseId, levelId) {
            const course = state.categories.find(c => c.id === courseId);
            if (!course) return;

            if (confirm("Vuoi rimuovere questo livello?")) {
                course.levels = course.levels.filter(l => l.id !== levelId);
                await saveCategoriesToCloud();
                showToast('Livello rimosso dal Cloud', 'info');
                render();
            }
        }

        async function handleVideoUpload(e) {
            e.preventDefault();
            
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session || session.user.email !== ADMIN_EMAIL) {
                showToast('Sessione non valida o scaduta. Effettua nuovamente il login.', 'error');
                return;
            }

            const title = document.getElementById('form-title').value;
            const category = document.getElementById('form-category').value;
            const level = document.getElementById('form-level').value;
            const youtubeUrl = document.getElementById('form-youtube-url').value.trim();
            const desc = document.getElementById('form-desc').value;

            if (!youtubeUrl) {
                showToast('Inserisci il link di YouTube', 'error');
                return;
            }

            showToast('Salvataggio in corso...', 'info');

            try {
                const newVideoRecord = {
                    title,
                    category,
                    level,
                    url: youtubeUrl,
                    description: desc
                };

                let { error: insertErr } = await supabaseClient.from('videos').insert([newVideoRecord]);
                
                if (insertErr) {
                    console.error("Errore Database:", insertErr);
                    showToast('Errore salvataggio database: ' + insertErr.message, 'error');
                } else {
                    showToast('Lezione aggiunta con successo!', 'success');
                    document.getElementById('form-title').value = '';
                    document.getElementById('form-youtube-url').value = '';
                    document.getElementById('form-desc').value = '';
                    await loadDataFromCloud();
                    navigate('videos', category, level);
                }
            } catch (err) {
                console.error("Errore critico:", err);
                showToast('Errore di connessione', 'error');
            }
        }

        async function deleteVideo(id, e) {
            if (e) e.stopPropagation();
            if (confirm('Sei sicuro di voler eliminare questa lezione?')) {
                let { error } = await supabaseClient.from('videos').delete().eq('id', id);
                if (error) {
                    showToast('Errore durante eliminazione: ' + error.message, 'error');
                } else {
                    state.videos = state.videos.filter(v => v.id.toString() !== id.toString());
                    // Rimuovi dai preferiti se era salvato
                    state.favorites = state.favorites.filter(favId => favId.toString() !== id.toString());
                    if (state.user && !state.isAdmin) {
                        await supabaseClient
                            .from('profiles')
                            .update({ favorites: state.favorites })
                            .eq('id', state.user.id);
                    }
                    showToast('Lezione eliminata con successo', 'info');
                    render();
                }
            }
        }

        async function toggleFavorite(id, e) {
            if (e) e.stopPropagation();
            const index = state.favorites.indexOf(id);
            if (index > -1) {
                state.favorites.splice(index, 1);
                showToast('Rimosso dai preferiti', 'info');
            } else {
                state.favorites.push(id);
                showToast('Aggiunto ai preferiti', 'success');
            }

            // Salva i preferiti nel database Supabase legati unicamente a questo utente
            if (state.user && !state.isAdmin) {
                await supabaseClient
                    .from('profiles')
                    .update({ favorites: state.favorites })
                    .eq('id', state.user.id);
            }

            render();
            if (state.currentVideoModal === id) {
                updateModalFavBtn();
            }
        }

        function toggleFavoriteFromModal() {
            if (state.currentVideoModal) {
                toggleFavorite(state.currentVideoModal);
            }
        }

        function updateModalFavBtn() {
            const btn = document.getElementById('modal-fav-btn');
            const isFav = state.favorites.includes(state.currentVideoModal);
            if (isFav) {
                btn.innerHTML = '<i class="fa-solid fa-heart accent-text"></i><span>Preferito</span>';
            } else {
                btn.innerHTML = '<i class="fa-regular fa-heart"></i><span>Preferito</span>';
            }
        }

        function openVideoModal(id) {
            const video = state.videos.find(v => v.id === id);
            if (!video) return;
            state.currentVideoModal = id;

            const modal = document.getElementById('video-modal');
            const container = document.getElementById('player-container');
            const titleEl = document.getElementById('modal-title');
            const badgeEl = document.getElementById('modal-badge');
            const catEl = document.getElementById('modal-category');
            const descEl = document.getElementById('modal-desc');

            const cat = state.categories.find(c => c.id === video.category);
            const lvlObj = cat && cat.levels ? cat.levels.find(l => l.id === video.level) : null;

            titleEl.innerText = video.title;
            catEl.innerText = cat ? cat.name : video.category;
            descEl.innerText = video.desc || 'Nessuna nota aggiuntiva fornita dai maestri.';
            badgeEl.innerText = lvlObj ? lvlObj.name : video.level;

            let videoUrl = video.url;
            
            // Estrazione pulita dell'ID YouTube da qualsiasi formato di link
            let videoId = '';
            if (videoUrl.includes('youtu.be/')) {
                videoId = videoUrl.split('youtu.be/')[1].split('?')[0];
            } else if (videoUrl.includes('watch?v=')) {
                videoId = videoUrl.split('watch?v=')[1].split('&')[0];
            } else if (videoUrl.includes('shorts/')) {
                videoId = videoUrl.split('shorts/')[1].split('?')[0];
            } else if (videoUrl.includes('embed/')) {
                videoId = videoUrl.split('embed/')[1].split('?')[0];
            }
            
            if (videoId) {
                // SOLUZIONE DEFINITIVA PER PC E MOBILE:
                // Usiamo youtube-nocookie.com con i parametri di compatibilità totale per l'embedding
                videoUrl = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&mute=0&controls=1&rel=0&playsinline=1&modestbranding=1`;
            }

            container.innerHTML = `
                <iframe
                    src="${videoUrl}"
                    title="Video della lezione"
                    class="w-full h-full absolute inset-0 border-0"
                    referrerpolicy="no-referrer"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen>
                </iframe>
            `;

            updateModalFavBtn();
            modal.classList.remove('hidden');
        }

        function closeVideoModal() {
            const modal = document.getElementById('video-modal');
            const container = document.getElementById('player-container');
            container.innerHTML = '';
            modal.classList.add('hidden');
            state.currentVideoModal = null;
        }

        function toggleSearchModal(show) {
            const modal = document.getElementById('search-modal');
            const input = document.getElementById('global-search-input');
            if (show) {
                modal.classList.remove('hidden');
                input.focus();
            } else {
                modal.classList.add('hidden');
                input.value = '';
                document.getElementById('search-results').innerHTML = '<p class="text-center opacity-50 text-sm py-8">Inizia a digitare per cercare tra tutte le lezioni...</p>';
            }
        }

        function handleGlobalSearch(query) {
            const resultsContainer = document.getElementById('search-results');
            if (!query.trim()) {
                resultsContainer.innerHTML = '<p class="text-center opacity-50 text-sm py-8">Inizia a digitare per cercare tra tutte le lezioni...</p>';
                return;
            }

            const q = query.toLowerCase();
            const matches = state.videos.filter(v => 
                v.title.toLowerCase().includes(q) || 
                (v.desc && v.desc.toLowerCase().includes(q)) ||
                v.category.toLowerCase().includes(q)
            );

            if (matches.length === 0) {
                resultsContainer.innerHTML = `<p class="text-center opacity-50 text-sm py-8">Nessun risultato trovato per "${query}"</p>`;
                return;
            }

            let html = '';
            matches.forEach(v => {
                const cat = state.categories.find(c => c.id === v.category);
                html += `
                    <div onclick="toggleSearchModal(false); openVideoModal('${v.id}')" class="p-3.5 rounded-2xl cursor-pointer transition flex items-center justify-between shadow-inner glass-card">
                        <div>
                            <div class="flex items-center space-x-2 mb-1">
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full glass-card accent-text uppercase">${cat ? cat.name : v.category}</span>
                                <span class="text-[10px] font-semibold opacity-60 uppercase">• ${v.level}</span>
                            </div>
                            <h4 class="font-bold text-sm">${v.title}</h4>
                        </div>
                        <i class="fa-solid fa-chevron-right text-xs accent-text"></i>
                    </div>
                `;
            });
            resultsContainer.innerHTML = html;
        }

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-msg');
            const iconEl = document.getElementById('toast-icon');

            msgEl.innerText = msg;
            iconEl.className = type === 'success' ? 'fa-solid fa-circle-check accent-text text-lg' : 'fa-solid fa-circle-info text-blue-400 text-lg';

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        async function approveStudent(userId) {
            let { error } = await supabaseClient.from('profiles').update({ status: 'approved' }).eq('id', userId);
            if (!error) {
                showToast('Studente approvato con successo!', 'success');
                await loadDataFromCloud();
                render();
            } else {
                showToast('Errore durante l\'approvazione', 'error');
            }
        }

        async function deleteStudent(userId) {
            if (confirm('Vuoi rimuovere/rifiutare questo studente?')) {
                let { error } = await supabaseClient.from('profiles').delete().eq('id', userId);
                if (!error) {
                    showToast('Richiesta rifiutata/rimossa', 'info');
                    await loadDataFromCloud();
                    render();
                } else {
                    showToast('Errore durante l\'eliminazione', 'error');
                }
            }
        }

        async function openEditStudentModal(userId) {
            const student = state.studentsList.find(s => s.id === userId);
            if (!student) return;

            document.getElementById('edit-student-id').value = student.id;
            document.getElementById('edit-student-title').innerText = `Modifica i corsi e livelli per @${student.username}`;

            let subs = student.subscriptions || {};
            let container = document.getElementById('edit-student-courses-container');
            let html = '';

            state.categories.forEach(cat => {
                let isChecked = !!subs[cat.id];
                let currentLvlId = subs[cat.id] || (cat.levels[0] ? cat.levels[0].id : 'base');
                let currentLvlObj = cat.levels?.find(l => l.id === currentLvlId) || cat.levels[0] || { name: 'Base' };

                html += `
                    <div class="p-3 rounded-2xl glass-card space-y-2">
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" name="edit-course" value="${cat.id}" ${isChecked ? 'checked' : ''} onchange="toggleEditLevels('${cat.id}', this.checked)" class="rounded accent-pink-500">
                            <span class="font-bold text-xs">${cat.name}</span>
                        </label>
                        <div id="edit-levels-${cat.id}" class="${isChecked ? '' : 'hidden'} pl-5 space-y-1">
                            <span class="text-[10px] opacity-70 uppercase block font-semibold">Livello massimo consentito:</span>
                            
                            <div class="custom-select-wrapper" id="select-wrapper-edit-${cat.id}">
                                <input type="hidden" id="edit-level-select-${cat.id}" value="${currentLvlId}">
                                <div class="custom-select-trigger" onclick="toggleCustomSelect('edit-${cat.id}')">
                                    <span id="trigger-label-edit-${cat.id}">${currentLvlObj.name}</span>
                                    <i class="fa-solid fa-chevron-down text-xs opacity-70 ml-2"></i>
                                </div>
                                <div class="custom-select-options modal-box" id="options-edit-${cat.id}">
                                    ${cat.levels.map(l => `
                                        <div class="custom-option ${l.id === currentLvlId ? 'selected' : ''}" onclick="selectEditOption('${cat.id}', '${l.id}', '${l.name.replace(/'/g, "\\'")}')">
                                            <span>${l.name}</span>${l.id === currentLvlId ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            document.getElementById('edit-student-modal').classList.remove('hidden');
        }

        function selectEditOption(catId, value, name) {
            document.getElementById(`edit-level-select-${catId}`).value = value;
            document.getElementById(`trigger-label-edit-${catId}`).innerText = name;
            document.getElementById(`options-edit-${catId}`).style.display = 'none';

            const container = document.getElementById(`options-edit-${catId}`);
            container.querySelectorAll('.custom-option').forEach(opt => {
                opt.classList.remove('selected');
                const check = opt.querySelector('i.fa-check');
                if(check) check.remove();
            });

            event.currentTarget.classList.add('selected');
            event.currentTarget.innerHTML += '<i class="fa-solid fa-check text-xs"></i>';
        }

        function toggleEditLevels(catId, isChecked) {
            const el = document.getElementById(`edit-levels-${catId}`);
            if (isChecked) el.classList.remove('hidden');
            else el.classList.add('hidden');
        }

        function closeEditStudentModal() {
            document.getElementById('edit-student-modal').classList.add('hidden');
        }

        async function saveStudentPermissions() {
            const userId = document.getElementById('edit-student-id').value;
            let subscriptions = {};

            document.querySelectorAll('input[name="edit-course"]:checked').forEach(chk => {
                let cId = chk.value;
                let lvlSel = document.getElementById(`edit-level-select-${cId}`);
                subscriptions[cId] = lvlSel ? lvlSel.value : 'base';
            });

            let { error } = await supabaseClient.from('profiles').update({ subscriptions: subscriptions, status: 'approved' }).eq('id', userId);
            if (!error) {
                showToast('Permessi aggiornati e studente approvato!', 'success');
                closeEditStudentModal();
                await loadDataFromCloud();
                render();
            } else {
                showToast('Errore durante il salvataggio', 'error');
            }
        }
    </script>
</body>
</html>
